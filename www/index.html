<title>Boodschappen Zala</title>

<style>
/* Layout: één smalle kolom voor de telefoon in de winkel; sticky tabbalk; kaarten alleen voor losse objecten (winkelstop, rit, formulier) */
:root{
  --bg:#f6f4ee; --card:#fffdf9; --ink:#1f2a24; --muted:#5f6a63; --line:#e3ded3;
  --accent:#3d6b4f; --accent-ink:#ffffff; --accent-soft:#e3ece4;
  --pap:#b8453c; --pap-soft:#f6e2de; --warn:#8f6512; --warn-soft:#f5ead2;
  --info:#2f5f7a; --info-soft:#e2ecf2; --wa:#2f7d4f; --wa-ink:#ffffff;
  --hu-r:#c0574e; --hu-w:#f1ece2; --hu-g:#4f7d5d;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a16; --card:#1c241f; --ink:#ece8df; --muted:#a2aaa1; --line:#2d3630;
  --accent:#8bbd9a; --accent-ink:#0f1a13; --accent-soft:#213328;
  --pap:#e3897e; --pap-soft:#3b2320; --warn:#e2b665; --warn-soft:#382b14;
  --info:#8fbbd8; --info-soft:#1a2a36; --wa:#4cbf7a; --wa-ink:#06180c;
  --hu-r:#c56a61; --hu-w:#d9d3c7; --hu-g:#6a9a78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a16; --card:#1c241f; --ink:#ece8df; --muted:#a2aaa1; --line:#2d3630;
  --accent:#8bbd9a; --accent-ink:#0f1a13; --accent-soft:#213328;
  --pap:#e3897e; --pap-soft:#3b2320; --warn:#e2b665; --warn-soft:#382b14;
  --info:#8fbbd8; --info-soft:#1a2a36; --wa:#4cbf7a; --wa-ink:#06180c;
  --hu-r:#c56a61; --hu-w:#d9d3c7; --hu-g:#6a9a78; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:660px;margin:0 auto;padding-block:16px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{font-family:var(--f-body);font-weight:600;font-size:.85rem;color:var(--accent);margin-left:6px;letter-spacing:.06em;text-transform:uppercase}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1rem;margin:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.head .right{display:flex;align-items:center;gap:10px}
.sync{font-size:.78rem;color:var(--muted)}
.head select{width:auto;padding:5px 8px;font-size:.85rem}
.tabs{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding-block:12px;margin-bottom:4px}
.tabs button{all:unset;cursor:pointer;flex:1;text-align:center;padding:10px 4px;border-radius:10px;font-weight:600;background:var(--card);border:1px solid var(--line);font-size:.95rem}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs button:focus-visible,.btn:focus-visible,.seg button:focus-visible,.icon:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{display:inline-block;min-width:1.4em;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--pap);color:var(--accent-ink);font-size:.75rem;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.tight{gap:8px}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
label.inline{flex-direction:row;align-items:center;gap:10px;font-size:.95rem;color:var(--ink);font-weight:500}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.form{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
.form .full{grid-column:1/-1}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn.wa{background:var(--wa);color:var(--wa-ink)}
.btn.danger{background:transparent;color:var(--pap);border:1px solid var(--pap)}
.btn[disabled]{opacity:.5;cursor:default}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row2 > *{flex:1 1 150px}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;flex:1 1 60px;text-align:center;padding:8px 6px;border-radius:9px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.group h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 6px}
.group h3 small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.8rem}
.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.items li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.items li.done .nm{text-decoration:line-through;color:var(--muted)}
.nm{font-weight:600;overflow-wrap:anywhere}
.hu{font-weight:500;color:var(--muted)}
.sub{font-size:.82rem;color:var(--muted)}
.acts{display:flex;align-items:center;gap:2px}
.acts select{width:auto;max-width:120px;padding:6px 8px;font-size:.82rem}
.icon{all:unset;cursor:pointer;color:var(--muted);padding:6px 7px;border-radius:8px;font-size:1.05rem;line-height:1}
.icon:hover{background:var(--accent-soft);color:var(--accent)}
.icon.on{color:var(--warn)}
.icon.del:hover{background:var(--pap-soft);color:var(--pap)}
.empty{color:var(--muted);text-align:center;padding:20px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;padding:6px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.88rem}
.chip:hover{filter:brightness(.97)}
details.card summary{cursor:pointer;font-family:var(--f-display);font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";color:var(--muted);font-family:var(--f-body)}
details.card[open] summary::after{content:"–"}
details.card[open] summary{margin-bottom:10px}
.stop{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px}
.num{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.stop.home .num{background:var(--line);color:var(--ink)}
.leg{font-size:.8rem;color:var(--muted);margin:2px 0 6px 48px;font-variant-numeric:tabular-nums}
.leg a{font-weight:600}
.note{font-size:.85rem;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--info-soft);color:var(--info)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.closed{background:var(--pap-soft);color:var(--pap)}
.pill.unknown{background:var(--line);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.ask{background:var(--warn-soft);color:var(--warn)}
.summary{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.summary b{font-family:var(--f-display);font-size:1.4rem;display:block}
.summary span{font-size:.8rem;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
pre.share{white-space:pre-wrap;font-family:var(--f-body);font-size:.9rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:0;max-height:240px;overflow:auto}
a{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom, 0px) + 18px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.people{list-style:none;margin:0;padding:0}
.people li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.people li:last-child{border-bottom:0}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--accent-ink);background:var(--accent)}
.av.alt{background:var(--info)}
.ride{display:flex;flex-direction:column;gap:6px}
.ride .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ride .when{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums}
.ride .trip{font-weight:600}
.code{font-family:var(--f-display);font-size:1.3rem;letter-spacing:.18em;font-weight:700}
.storelist{list-style:none;margin:0;padding:0}
.storelist li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.section-title{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
@media (max-width:440px){.form{grid-template-columns:minmax(0,1fr)} .acts select{max-width:96px}}
.huflag{display:flex;height:4px;border-radius:2px;overflow:hidden;margin:10px 0 0;opacity:.85}
.huflag i{flex:1}.huflag i:nth-child(1){background:var(--hu-r)}.huflag i:nth-child(2){background:var(--hu-w);box-shadow:inset 0 0 0 1px var(--line)}.huflag i:nth-child(3){background:var(--hu-g)}
.made{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.made span{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.made a{display:block;line-height:0}
.jlogo{width:220px;max-width:70vw;height:auto}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .jlogo [fill="#12305A"]{fill:#ece8df}:root:not([data-theme="light"]) .jlogo [stroke="#12305A"]{stroke:#ece8df}:root:not([data-theme="light"]) .jlogo [fill="#0E93A3"]{fill:#2CC4D4}:root:not([data-theme="light"]) .jlogo [stroke="#0E93A3"]{stroke:#2CC4D4}}
:root[data-theme="dark"] .jlogo [fill="#12305A"]{fill:#ece8df}:root[data-theme="dark"] .jlogo [stroke="#12305A"]{stroke:#ece8df}:root[data-theme="dark"] .jlogo [fill="#0E93A3"]{fill:#2CC4D4}:root[data-theme="dark"] .jlogo [stroke="#0E93A3"]{stroke:#2CC4D4}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

/* openingstijden (OSM opening_hours, de gangbare vormen) */
const DAY=["Su","Mo","Tu","We","Th","Fr","Sa"];
function parseOH(str){
  if(!str)return null;let s=str.trim();if(s==="24/7")return{all:true};
  s=s.replace(/(\d{2}:\d{2}|off|closed)\s*,\s*(?=(Mo|Tu|We|Th|Fr|Sa|Su|PH)\b)/g,"$1;");
  const days={};let any=false;
  for(let rule of s.split(";")){
    rule=rule.trim();if(!rule)continue;
    const m=rule.match(/^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su|PH)(?:\s*-\s*(?:Mo|Tu|We|Th|Fr|Sa|Su))?\s*,?\s*)*)(.*)$/);if(!m)return null;
    const dspec=m[1].trim(),rest=m[2].trim();let dl=[];
    if(!dspec)dl=[0,1,2,3,4,5,6];
    else for(const part of dspec.split(",")){const p=part.trim();if(!p||p==="PH")continue;const r=p.split(/\s*-\s*/);const a=DAY.indexOf(r[0]),b=r[1]?DAY.indexOf(r[1]):a;if(a<0||b<0)return null;let i=a;for(let k=0;k<7;k++){dl.push(i);if(i===b)break;i=(i+1)%7;}}
    if(!dl.length)continue;
    let iv=[];
    if(!/^(off|closed)$/i.test(rest)){for(const tr of rest.split(",")){const q=tr.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);if(!q)return null;iv.push([+q[1]*60+ +q[2],+q[3]*60+ +q[4]]);}}
    for(const d of dl)days[d]=iv;any=true;
  }
  return any?{days}:null;
}
function openAt(s,date){
  if(!s||s.ohP===undefined||s.ohP===false)return null;
  if(s.ohP===null)s.ohP=parseOH(s.oh)||false;if(!s.ohP)return null;if(s.ohP.all)return true;
  const iv=s.ohP.days[date.getDay()];if(!iv)return false;const m=date.getHours()*60+date.getMinutes();
  return iv.some(([a,b])=>b>a?(m>=a&&m<b):(m>=a||m<b));
}

const RAD=x=>x*Math.PI/180;
function hav(a,b){if(!a||!b||a.lat==null||b.lat==null)return 0;const dLa=RAD(b.lat-a.lat),dLo=RAD(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(RAD(a.lat))*Math.cos(RAD(b.lat))*Math.sin(dLo/2)**2;return 2*6371*Math.asin(Math.sqrt(h));}
const road=(a,b)=>hav(a,b)*1.3;
function legMin(km,mode){if(km<=0)return 0;if(mode==="bike")return km/15*60;if(mode==="walk")return km/4.8*60;return(km<4?km/25*60:4/25*60+(km-4))+3;}
const shopMin=n=>6+Math.round(n*1.2);
const nearestN=(arr,p,k)=>arr.slice().sort((a,b)=>hav(p,a)-hav(p,b)).slice(0,k);
const townNearest=p=>nearestN(TOWNS,p,1)[0];

function permute(a){if(a.length<=1)return[a];const out=[];a.forEach((x,i)=>{for(const p of permute([...a.slice(0,i),...a.slice(i+1)]))out.push([x,...p]);});return out;}
function cartesian(lists){return lists.reduce((acc,l)=>acc.flatMap(a=>l.map(x=>[...a,x])),[[]]);}
function greedy(stops,start){const left=[...stops],out=[];let p=start;while(left.length){left.sort((a,b)=>hav(p,a.s)-hav(p,b.s));p=left.shift();out.push(p);p=p.s;}return out;}
function startPoint(){
  const r=S.route,h=(S.hh&&S.hh.home)||DEFAULT_HOME;
  if(r.start==="gps"&&r.gps)return{name:t("myLoc"),lat:r.gps.lat,lng:r.gps.lng};
  if(r.start.startsWith("town:")){const tw=townBy(r.start.slice(5));if(tw)return{name:tw.name,lat:tw.lat,lng:tw.lng};}
  if(r.start==="coords"){const c=parseCoord(r.coords);if(c)return{name:c.lat.toFixed(4)+", "+c.lng.toFixed(4),...c};}
  return{name:h.name||t("home"),lat:h.lat,lng:h.lng};
}
function depDate(){const d=new Date();const m=(S.route.dep||"").match(/^(\d{1,2}):(\d{2})$/);if(m)d.setHours(+m[1],+m[2],0,0);return d;}
function evalRoute(order,start,dep,mode,back){
  let tm=dep.getTime(),km=0,mins=0,pen=0,p=start;const legs=[];
  for(const st of order){const d=road(p,st.s),m=legMin(d,mode);km+=d;mins+=m;tm+=m*6e4;const o=openAt(st.s,new Date(tm));if(o===false)pen+=500;legs.push({km:d,min:m,eta:tm,open:o});tm+=shopMin(st.items.length)*6e4;p=st.s;}
  let backLeg=null;if(back){const d=road(p,start),m=legMin(d,mode);km+=d;mins+=m;tm+=m*6e4;backLeg={km:d,min:m};}
  return{cost:mins+pen,km,mins,legs,backLeg,end:tm};
}
function planItems(){return S.items.filter(i=>!i.done||(i.doneAt&&i.doneAt>=S.routeSince));}
function plan(){
  const its=planItems(),start=startPoint(),mode=S.route.mode,dep=depDate(),back=S.route.back;
  const slotsMap=new Map(),anyItems=[];
  for(const i of its){const k=normTgt(i.tgt);if(k==="any"){anyItems.push(i);continue;}if(!slotsMap.has(k))slotsMap.set(k,[]);slotsMap.get(k).push(i);}
  const slots=[],noGeo=[],unplaced=[];
  for(const [k,arr] of slotsMap){
    let c=[];
    if(k.startsWith("ch:"))c=nearestN(STORES.filter(s=>s.ch===k.slice(3)),start,3);
    else if(k==="mk")c=nearestN(STORES.filter(s=>s.ty==="m"),start,3);
    else{const s=storeById(k.slice(3));if(s){if(s.lat==null){noGeo.push({s,items:arr});continue;}c=[s];}}
    if(c.length)slots.push({k,c,items:arr});else unplaced.push(...arr);
  }
  let anyOwn=false;
  if(anyItems.length&&!slots.length&&!noGeo.length){slots.push({k:"any",c:nearestN(STORES.filter(s=>s.ty==="s"),start,3),items:anyItems});anyOwn=true;}
  const K=slots.length>5?1:slots.length>4?2:3;slots.forEach(sl=>sl.c=sl.c.slice(0,K));
  let best=null;
  if(slots.length)for(const combo of cartesian(slots.map(sl=>sl.c))){
    const m=new Map();combo.forEach((s,i)=>{if(!m.has(s.id))m.set(s.id,{s,items:[]});m.get(s.id).items.push(...slots[i].items);});
    const stops=[...m.values()];
    for(const o of(stops.length<=6?permute(stops):[greedy(stops,start)])){const ev=evalRoute(o,start,dep,mode,back);if(!best||ev.cost<best.cost)best={...ev,order:o};}
  }
  const order=best?best.order.map((st,i)=>({s:st.s,items:[...st.items],leg:best.legs[i]})):[];
  if(anyItems.length&&!anyOwn){const tgt=order.find(x=>x.s.ty==="s")||order[0];if(tgt)tgt.items.push(...anyItems);else if(noGeo[0])noGeo[0].items.push(...anyItems);}
  for(const g of noGeo)order.push({s:g.s,items:g.items,leg:null});
  return{start,dep:dep.getTime(),stops:order,km:best?best.km:0,mins:best?best.mins:0,backLeg:best?best.backLeg:null,end:best?best.end:dep.getTime(),unplaced};
}

    <div class="row2"><label>${t("townsGrp")}<select id="sHomeTown" data-bind="sv.homeTown"><option value="">${t("chooseTown")}</option>${TOWNS.map(tw=>`<option ${v.homeTown===tw.name?"selected":""}>${esc(tw.name)}</option>`).join("")}</select></label><button class="btn ghost" type="button" id="sUseTown" style="flex:0 0 auto">${t("useTown")}</button></div>
    <div class="row2"><label>${t("homeName")}<input id="sHomeName" data-bind="sv.homeName" value="${esc(v.homeName)}"></label><label>${t("coords")}<input id="sHomeCoords" data-bind="sv.homeCoords" value="${esc(v.homeCoords)}"></label></div>
    <div class="sub">${t("homeHelp")}</div><div class="row2"><button class="btn" type="button" id="sHomeSave" style="flex:0 0 auto">${t("save")}</button></div></section>`;
  const send=`<section class="card stack"><h2>${t("send")}</h2>
    <div class="row2"><label>${t("defMail")}<input id="sMail" type="email" data-bind="sv.mail" value="${esc(v.mail)}"></label><label>${t("waNr")}<input id="sWa" data-bind="sv.wa" value="${esc(v.wa)}" placeholder="+31612345678"></label></div>
    <div class="sub">${t("waHelp")}</div><div class="row2"><button class="btn" type="button" id="sSendSave" style="flex:0 0 auto">${t("save")}</button></div></section>`;
  const pinned=(h.myStores||[]).map(id=>STORE_BY[id]).filter(Boolean);
  const stores=`<section class="card stack"><h2>${t("myStores")}</h2><div class="sub">${t("myStoresHelp")}</div>
    <ul class="storelist">${pinned.map(s=>`<li><span style="min-width:0"><b>${esc(storeName(s))}</b><br><span class="sub">${esc([s.addr,s.city].filter(Boolean).join(", "))}</span></span><button class="btn ghost small" type="button" data-unpin="${esc(s.id)}">${t("unpin")}</button></li>`).join("")}${(h.stores||[]).map(s=>`<li><span style="min-width:0"><b>${esc(s.name)}</b><br><span class="sub">${esc(s.addr||"")}${s.lat==null?" · "+t("noLocStore"):""}</span></span><button class="icon del" type="button" data-delstore="${esc(s.id)}" aria-label="${esc(t("del"))}">✕</button></li>`).join("")||`<li class="sub">${t("noMyStores")}</li>`}</ul>
    <label>${t("searchStore")}<input id="stQ" data-bind="stq" value="${esc(S.stq)}" placeholder="Lidl, Keszthely, Coop…"></label><div id="stRes">${storeResults()}</div>
    <div class="section-title">${t("customStore")}</div>
    <div class="row2"><label>${t("storeName")}<input id="nsName" data-bind="sv.nsName" value="${esc(v.nsName)}" placeholder="${esc(t("storeNamePh"))}"></label><label>${t("storeAddr")}<input id="nsAddr" data-bind="sv.nsAddr" value="${esc(v.nsAddr)}"></label></div>
    <label>${t("coords")}<input id="nsCoord" data-bind="sv.nsCoord" value="${esc(v.nsCoord)}" placeholder="${esc(t("coordsPh"))}"></label>
    <div class="row2"><button class="btn ghost" type="button" id="nsAdd" style="flex:0 0 auto">${t("addStore")}</button></div></section>`;
  const about=`<section class="card stack tight"><h2>${t("about")}</h2><p class="sub" style="margin:0">${t("aboutText",STORES.length)}</p>${S.local?"":`<div class="row2" style="align-items:center"><span class="sub" style="flex:1 1 auto">${esc(t("signedIn",S.email||""))}</span><button class="btn ghost small" type="button" id="logout" style="flex:0 0 auto">${t("logout")}</button></div>`}</section>`;
  return`<div class="stack">${lang}${hh}${home}${send}${stores}${about}</div>`;
}

/* ---------- render ---------- */
const TABS=[["lijst","tabList"],["route","tabRoute"],["samen","tabTogether"],["inst","tabSettings"]];
function isTyping(el){return el&&el.matches&&el.matches("input:not([type=checkbox]),textarea,select");}
function render(){
  const ae=document.activeElement,fid=ae&&ae.id;let sel=null;try{if(ae&&ae.selectionStart!=null)sel=[ae.selectionStart,ae.selectionEnd];}catch(_){}
  document.documentElement.lang=L;$("#hdrLang").value=L;
  $("#appTitle").innerHTML=esc(t("appTitle"))+"<small>Zala</small>";
  {const mb=document.getElementById("madeBy"); if(mb) mb.textContent=t("madeBy");}
  $("#sync").textContent=syncText();
  const n=openItems().length;
  $("#tabs").innerHTML=TABS.map(([id,k])=>`<button role="tab" type="button" data-tab="${id}" aria-selected="${S.tab===id}">${t(k)}${id==="lijst"&&n?`<span class="badge">${n}</span>`:""}</button>`).join("");
  $("#main").innerHTML=S.tab==="lijst"?viewList():S.tab==="route"?viewRoute():S.tab==="samen"?viewTogether():viewSettings();
  if(S.tab==="route"){const wa=$("#waBtn");if(wa){const num=((S.hh&&S.hh.wa)||"").replace(/\D/g,"");wa.href="https://wa.me/"+num+"?text="+encodeURIComponent($("#shareTxt").textContent);}}
  if(fid){const el=document.getElementById(fid);if(el&&el!==document.activeElement){el.focus({preventScroll:true});if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1]);}catch(_){}}}
}
function soft(){if(isTyping(document.activeElement)){S.pending=true;return;}render();}
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.pending&&!isTyping(document.activeElement)){S.pending=false;render();}},0));

/* ---------- acties ---------- */
function setPath(path,val){const ks=path.split(".");let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]]=o[ks[i]]||{};o[ks[ks.length-1]]=val;}
function setLang(l){if(!LANGS.includes(l))return;L=l;try{localStorage.setItem("bz-lang",l);}catch(_){}if(S.profile&&!S.local&&!S.ro)saveProfile({lang:l});render();}
function gpsFail(){S.route.start="home";S.route.locMsg=t("locFail");S.route.locOk=false;render();}
function requestGps(){
  S.route.locMsg=t("locBusy");S.route.locOk=false;render();
  if(!navigator.geolocation){gpsFail();return;}
  let done=false;const to=setTimeout(()=>{if(!done){done=true;gpsFail();}},8000);
  try{navigator.geolocation.getCurrentPosition(pos=>{if(done)return;done=true;clearTimeout(to);S.route.gps={lat:pos.coords.latitude,lng:pos.coords.longitude};S.route.start="gps";S.route.locMsg=t("locOk");S.route.locOk=true;render();},()=>{if(done)return;done=true;clearTimeout(to);gpsFail();},{enableHighAccuracy:false,timeout:7000,maximumAge:300000});}
  catch(_){done=true;clearTimeout(to);gpsFail();}
}
async function addItem(base){
  const it={id:newId("i"),pid:base.pid||null,name:base.pid?"":base.name,cat:base.cat||"other",qty:base.qty||"",tgt:base.tgt||"any",done:false,by:S.uid||null,created:Date.now()};
  await putItem(it);return it;
}
async function updateRide(id,fn){const r=S.rides.find(x=>x.id===id);if(!r)return;const riders=fn((r.riders||[]).map(x=>({...x})));await w(()=>S.db.doc("rides/"+id).update({riders}));}
async function copyText(txt,fallbackEl){try{await navigator.clipboard.writeText(txt);toast(t("copied"));}catch(_){if(fallbackEl){const r=document.createRange();r.selectNodeContents(fallbackEl);const s=getSelection();s.removeAllRanges();s.addRange(r);}toast(t("selected"));}}

document.addEventListener("input",e=>{const b=e.target.dataset&&e.target.dataset.bind;if(!b)return;setPath(b,e.target.type==="checkbox"?e.target.checked:e.target.value);if(e.target.id==="stQ"){const el=$("#stRes");if(el)el.innerHTML=storeResults();}});
document.addEventListener("toggle",e=>{if(e.target.id==="tplBox")S.tplOpen=e.target.open;if(e.target.id==="rideForm")S.rfOpen=e.target.open;},true);
document.addEventListener("submit",e=>{
  if(e.target.id!=="addForm")return;e.preventDefault();
  const fs=S.fs,custom=fs.prod==="__custom"||!(CAT_PRODUCTS[fs.cat]||[]).length;
  const name=custom?(fs.name||"").trim():"";if(custom&&!name){toast(t("fillProduct"));$("#fName")&&$("#fName").focus();return;}
  const tgt=$("#fTgt").value,qty=(fs.qty||"").trim();
  const cat=custom?(fs.cat==="other"?guessCat(name):fs.cat):fs.cat;
  addItem({pid:custom?null:fs.prod,name,cat,qty,tgt});
  S.fs={...fs,name:"",qty:"",tgt};
  if(tgt!==S.hh.lastTgt)updHh({lastTgt:tgt});else render();
  toast(t("added",custom?name:itemName({pid:fs.prod}).nm));
  if(custom)$("#fName")&&$("#fName").focus();
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.bind){setPath(el.dataset.bind,el.type==="checkbox"?el.checked:el.value);if(el.dataset.rerender!=null)render();return;}
  if(el.id==="fCat"){S.fs.cat=el.value;S.fs.prod=(CAT_PRODUCTS[el.value]||[])[0]||"__custom";render();const f=S.fs.prod==="__custom"?$("#fName"):$("#fProd");f&&f.focus();return;}
  if(el.id==="fProd"){S.fs.prod=el.value;render();if(el.value==="__custom")$("#fName")&&$("#fName").focus();return;}
  if(el.id==="hdrLang"||el.id==="sLang"){setLang(el.value);return;}
  if(el.id==="rStart"){if(el.value==="gps"){requestGps();return;}S.route.start=el.value;S.route.locMsg="";render();return;}
  if(el.id==="rDep"){S.route.dep=el.value;render();return;}
  if(el.id==="rCoords"){render();return;}
  if(el.id==="nearR"){S.near=+el.value;render();return;}
  if(el.dataset.done){const it=S.items.find(i=>i.id===el.dataset.done);if(it)putItem({...it,done:el.checked,doneAt:el.checked?Date.now():null});return;}
  if(el.dataset.move){const it=S.items.find(i=>i.id===el.dataset.move);if(it)putItem({...it,tgt:el.value});return;}
});
document.addEventListener("click",async e=>{
  const tg=e.target.closest("button,[data-tab]");if(!tg)return;const d=tg.dataset;
  if(d.tab){S.tab=d.tab;S.clearArm=false;if(d.tab==="route")S.routeSince=Date.now();if(d.tab==="inst")svInit();if(d.tab==="samen"&&S.profile&&!S.pf)S.pf=null;render();window.scrollTo({top:0});return;}
  if(d.mode){S.route.mode=d.mode;render();return;}
  if(d.copy){copyText(d.copy);return;}
  if(tg.id==="clearDone"){if(!S.clearArm){S.clearArm=true;render();return;}S.clearArm=false;const ids=S.items.filter(i=>i.done).map(i=>i.id);
    if(S.local){S.items=S.items.filter(i=>!i.done);saveLocal();render();}else for(const id of ids){if(!await w(()=>S.db.collection("hh/"+S.hid+"/items").doc(id).delete()))break;}
    toast(t("cleared"));return;}
  if(d.del){dropItem(d.del);return;}
  if(d.fav){const it=S.items.find(i=>i.id===d.fav);if(!it)return;const favs=(S.hh.favs||[]).slice();const k=favKey(it),ix=favs.findIndex(f=>favKey(f)===k);
    if(ix>=0){favs.splice(ix,1);toast(t("favRemoved"));}else{favs.push({pid:it.pid||null,name:it.name||"",cat:it.cat,qty:it.qty||"",tgt:it.tgt||"any"});toast(t("favAdded"));}updHh({favs:favs.slice(-40)});return;}
  if(d.addfav!=null){const f=(S.hh.favs||[])[+d.addfav];if(f){await addItem(f);toast(t("added",itemName(f).nm));}return;}
  if(tg.id==="tplSave"){const name=(S.tplName||"").trim();if(!name){toast(t("tplNeedName"));return;}const open=openItems();if(!open.length){toast(t("tplEmpty"));return;}
    const tp={id:newId("t"),name:name.slice(0,40),items:open.map(i=>({pid:i.pid||null,name:i.name||"",cat:i.cat,qty:i.qty||"",tgt:i.tgt||"any"}))};S.tplName="";S.tplSel=tp.id;S.tplOpen=true;updHh({tpls:[...(S.hh.tpls||[]),tp].slice(-20)});toast(t("tplSaved"));return;}
  if(tg.id==="tplApply"){const tp=(S.hh.tpls||[]).find(x=>x.id===S.tplSel);if(!tp)return;for(const x of tp.items)await addItem(x);toast(t("tplAdded",tp.items.length));return;}
  if(tg.id==="tplDel"){updHh({tpls:(S.hh.tpls||[]).filter(x=>x.id!==S.tplSel)});return;}
  if(tg.id==="copyBtn"){copyText($("#shareTxt").textContent,$("#shareTxt"));return;}
  if(tg.id==="mailBtn"){
    const to=(S.mailTo||S.hh.email||"").trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){toast(t("invalidMail"));$("#mailTo")&&$("#mailTo").focus();return;}
    if(!S.mcp){const pl=plan();if(to!==(S.hh.email||""))updHh({email:to});
      location.href="mailto:"+to+"?subject="+encodeURIComponent(t("shopTitle",new Date().toLocaleDateString(LOCALE[L],{day:"numeric",month:"long"})))+"&body="+encodeURIComponent(shareText(pl));
      S.mailMsg=t("mailOpened");render();return;}
    tg.setAttribute("disabled","");tg.textContent=t("sending");const pl=plan();
    try{await S.mcp.callTool("Microsoft 365","outlook_send_mail",{to:[to],subject:t("shopTitle",new Date().toLocaleDateString(LOCALE[L],{day:"numeric",month:"long"})),body:shareHTML(pl),bodyType:"html"});S.mailMsg=t("mailSent",to);toast(S.mailMsg);}
    catch(err){S.mailMsg=t("mailFail");toast(S.mailMsg);}
    render();return;}
  if(tg.id==="offerRide"){const pl=plan(),first=pl.stops[0];const myTown=S.profile.town||(townNearest(pl.start)||{}).name;
    S.rf={...defaultRf(),from:myTown?"town:"+myTown:"own",to:first&&first.s.city&&townBy(first.s.city)?first.s.city:"Nagykanizsa",time:S.route.dep||nextHourHM(),note:pl.stops.map(x=>storeName(x.s)).join(", ").slice(0,200)};
    S.rfOpen=true;S.tab="samen";render();setTimeout(()=>{const f=$("#rideForm");f&&f.scrollIntoView({behavior:"smooth",block:"start"});},50);return;}
  if(tg.id==="pSave"){const pf=S.pf;if(!pf||!pf.nick.trim()){toast(t("needNick"));$("#pNick")&&$("#pNick").focus();return;}
    if(await saveProfile({nick:pf.nick.trim().slice(0,30),town:pf.town||"",visible:!!pf.visible,contact:(pf.contact||"").trim().slice(0,60)}))toast(t("saved"));render();return;}
  if(tg.id==="fAdd"){const code=(S.fcode||"").trim().toUpperCase();const hit=Object.entries(S.profiles).find(([u,q])=>q.code===code);
    if(!code||!hit){toast(t("noUser"));return;}if(hit[0]===S.uid){toast(t("selfCode"));return;}
    if(await saveProfile({friends:[...new Set([...(S.profile.friends||[]),hit[0]])]})){S.fcode="";toast(t("reqSent",hit[1].nick||t("someone")));}render();return;}
  if(d.befriend){if(await saveProfile({friends:[...new Set([...(S.profile.friends||[]),d.befriend])]}))toast(t("reqSent",nickOf(d.befriend)));render();return;}
  if(d.unfriend){await saveProfile({friends:(S.profile.friends||[]).filter(u=>u!==d.unfriend)});render();return;}
  if(tg.id==="rPub"){const rf=S.rf;let from=null;
    if(rf.from.startsWith("town:")){const tw=townBy(rf.from.slice(5));if(tw)from={name:tw.name+" – "+t("centre"),lat:tw.lat,lng:tw.lng};}
    else{const c=parseCoord(rf.pcoords);if(c&&rf.pname.trim())from={name:rf.pname.trim().slice(0,60),...c};}
    if(!from){toast(t("rideNeedPoint"));return;}
    const when=new Date(rf.date+"T"+rf.time).getTime();if(!when||when<Date.now()-5*6e4){toast(t("rideNeedTime"));return;}
    const to=townBy(rf.to);const id=newId("r");
    const ride={driver:S.uid,fromName:from.name,fromLat:from.lat,fromLng:from.lng,toName:to?to.name:rf.to,toLat:to?to.lat:null,toLng:to?to.lng:null,when,seats:+rf.seats||1,vis:rf.vis==="friends"?"friends":"nearby",note:(rf.note||"").trim().slice(0,200),riders:[],created:Date.now()};
    if(await w(()=>S.db.collection("rides").doc(id).set(ride))){toast(t("ridePosted"));S.rf=defaultRf();S.rfOpen=false;}render();return;}
  if(d.join){w(()=>S.db.rpc("ride_rider",{p_ride:d.join,p_action:"ask"}));return;}
  if(d.cancel){w(()=>S.db.rpc("ride_rider",{p_ride:d.cancel,p_action:"cancel"}));return;}
  if(d.approve){const [rid,u]=d.approve.split("|");updateRide(rid,rs=>rs.map(x=>x.u===u?{...x,s:"ok"}:x));return;}
  if(d.decline){const [rid,u]=d.decline.split("|");updateRide(rid,rs=>rs.filter(x=>x.u!==u));return;}
  if(d.delride){if(await w(()=>S.db.doc("rides/"+d.delride).delete()))toast(t("rideDeleted"));return;}
  if(tg.id==="logout"){window.BZ&&window.BZ.logout();return;}
  if(tg.id==="sHhSave"){const n=(S.sv.hhName||"").trim();if(n){updHh({name:n.slice(0,40)});toast(t("saved"));}return;}
  if(tg.id==="sJoinBtn"){const code=(S.sv.join||"").trim().toUpperCase();if(!code||code===S.hh.code){toast(t("noHh"));return;}
    try{let res=null;if(!await w(async()=>{res=await S.db.rpc("join_household",{p_code:code});}))return;if(!res||!res.id){toast(t("noHh"));return;}
      const old=S.hid,oldMembers=(S.hh.members||[]).filter(u=>u!==S.uid);
      if(old&&old!==res.id&&oldMembers.length)await w(()=>S.db.rpc("leave_household",{p_hid:old}));
      await saveProfile({hh:res.id});S.sv.join="";toast(t("joined",res.name||""));subscribeHh(res.id);}
    catch(_){toast(t("saveFail"));}return;}
  if(tg.id==="sUseTown"){const tw=townBy(S.sv.homeTown);if(tw){S.sv.homeName=tw.name;S.sv.homeCoords=tw.lat.toFixed(5)+", "+tw.lng.toFixed(5);render();}return;}
  if(tg.id==="sHomeSave"){const c=parseCoord(S.sv.homeCoords);if(!c){toast(t("coordsBad"));return;}updHh({home:{name:(S.sv.homeName||"").trim()||t("home"),...c}});S.route.start="home";toast(t("homeSaved"));return;}
  if(tg.id==="sSendSave"){updHh({email:(S.sv.mail||"").trim(),wa:(S.sv.wa||"").trim()});toast(t("saved"));return;}
  if(d.pin){updHh({myStores:[...new Set([...(S.hh.myStores||[]),d.pin])]});return;}
  if(d.unpin){updHh({myStores:(S.hh.myStores||[]).filter(x=>x!==d.unpin)});return;}
  if(tg.id==="nsAdd"){const v=S.sv,name=(v.nsName||"").trim();if(!name){toast(t("needStoreName"));return;}const c=parseCoord(v.nsCoord);
    const s={id:"cu-"+Date.now().toString(36),name:name.slice(0,60),addr:(v.nsAddr||"").trim().slice(0,80),city:"",ty:"c",ch:"",lat:c?c.lat:null,lng:c?c.lng:null};
    v.nsName=v.nsAddr=v.nsCoord="";updHh({stores:[...(S.hh.stores||[]),s]});toast(t("storeAdded",name));return;}
  if(d.delstore){updHh({stores:(S.hh.stores||[]).filter(s=>s.id!==d.delstore)});return;}
});

/* ---------- start ---------- */
function subscribeHh(hid){
  S.unsubHh&&S.unsubHh();S.unsubIt&&S.unsubIt();S.hid=hid;S.loaded=false;S.hh=null;S.items=[];
  S.unsubHh=S.db.doc("hh/"+hid).onSnapshot(d=>{S.hh=d.exists?d.data():null;soft();},()=>{});
  S.unsubIt=S.db.collection("hh/"+hid+"/items").onSnapshot(snap=>{S.items=snap.docs.map(x=>({id:x.id,...x.data()}));S.loaded=true;S.lost=false;S.syncAt=Date.now();soft();},()=>{S.lost=true;soft();});
}
async function ensureProfileAndHh(){
  let p=S.profiles[S.uid];
  if(!p){if(S.ro){S.loaded=true;render();return;}
    p={nick:"",town:"",visible:false,contact:"",code:code6(),friends:[],lang:L,hh:null,created:Date.now()};S.profile=p;
    if(!await saveProfile({}))return;}
  if(!p.hh){if(S.ro){S.loaded=true;render();return;}
    const hid=newId("h");const hh={name:t("myHh"),members:[S.uid],code:code6(),home:DEFAULT_HOME,favs:[],tpls:[],stores:[],myStores:[],email:"",wa:"",lastTgt:"any",created:Date.now()};
    if(await w(()=>S.db.doc("hh/"+hid).set(hh))){await saveProfile({hh:hid});subscribeHh(hid);}}
}
function pruneRides(){const lim=Date.now()-864e5;for(const r of S.rides)if(r.driver===S.uid&&r.when<lim)S.db.doc("rides/"+r.id).delete().catch(()=>{});}
(async()=>{
  render();
  let db=null,user=null;
  try{const b=window.BZ&&await window.BZ.ready;if(b){db=b.db;user=b.user;S.email=b.user.email||"";}}catch(_){}
  let uid=null;
  if(user){try{uid=await user.id();const wr=await user.can("data.write");if(wr===false)S.ro=true;}catch(_){}}
  if(!db||!uid){S.local=true;loadLocal();S.loaded=true;render();return;}
  S.db=db;S.uid=uid;render();
  db.collection("profiles").onSnapshot(snap=>{
    const m={};snap.docs.forEach(x=>{m[x.id]=x.data();});S.profiles=m;
    const p=m[S.uid];
    if(p){S.profile=p;if(!S.langInit){S.langInit=true;if(p.lang&&LANGS.includes(p.lang))L=p.lang;}if(p.hh&&p.hh!==S.hid)subscribeHh(p.hh);}
    if(!S.ensured){S.ensured=true;ensureProfileAndHh();}
    soft();
  },()=>{S.lost=true;soft();});
  db.collection("rides").onSnapshot(snap=>{S.rides=snap.docs.map(x=>({id:x.id,...x.data()}));if(!S.pruned){S.pruned=true;pruneRides();}soft();},()=>{});
})();
if("serviceWorker" in navigator&&!window.Capacitor&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
