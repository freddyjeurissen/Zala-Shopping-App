<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zala - Boodschappen App</title>
<meta name="theme-color" content="#36684a">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6f4ee;--card:#ffffff;--ink:#1f2a24;--muted:#5f6a63;--line:#e3ded3;--accent:#36684a;--accent-ink:#fff;--hu-r:#ce2939;--hu-w:#ffffff;--hu-g:#477050;
--f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--f-body:"Figtree","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#141a16;--card:#1c241f;--ink:#ece8df;--muted:#a2aaa1;--line:#2d3630;--accent:#7fc192;--accent-ink:#0f1a13;--hu-r:#e0434f;--hu-w:#f2f2f2;--hu-g:#5f9a6e;color-scheme:dark}
 .logo-light{display:none}.logo-dark{display:block!important}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top img{width:56px;height:56px;border-radius:14px}
.lang{display:flex;gap:4px;flex-wrap:wrap}
.lang a{padding:6px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem}
.lang a[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h1{font-family:var(--f-display);font-size:2.4rem;line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 small{display:block;font-size:1.3rem;font-weight:700;margin-top:6px;letter-spacing:-.01em;color:var(--accent)}
.flag{display:flex;height:5px;border-radius:3px;overflow:hidden}.flag i{flex:1}.flag i:nth-child(1){background:var(--hu-r)}.flag i:nth-child(2){background:var(--hu-w);box-shadow:inset 0 0 0 1px var(--line)}.flag i:nth-child(3){background:var(--hu-g)}
.tag{margin:0;color:var(--muted);font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px}
#qr{background:#fff;padding:12px;border-radius:10px;line-height:0}#qr img,#qr canvas{width:220px;height:220px;max-width:100%}
.btn{display:inline-block;padding:12px 18px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.made{margin-top:10px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.made span{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.made img{width:220px;max-width:70vw;height:auto}
a{color:var(--accent)}
.btn:focus-visible,.lang a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body>
<div class="wrap">
  <div class="top"><img src="icon-192.png" alt=""><nav class="lang" id="lang" aria-label="Taal / Sprache / Language / Nyelv"></nav></div>
  <h1>Zala<small id="t_name"></small></h1>
  <div class="flag" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="tag" id="t_tag"></p>
  <div class="card">
    <div id="qr" role="img" aria-label="QR"></div>
    <div class="row"><a class="btn" id="dl" href="#"></a><a class="btn ghost" id="web" href="index.html"></a></div>
  </div>
  <ol id="t_steps"></ol>
  <div class="made"><span>Made &amp; protected by</span>
    <img class="logo-light" src="jeemc2-logo.png" alt="JEEMC² Crypto &amp; AI Security">
    <img class="logo-dark" src="jeemc2-logo-wit.png" alt="JEEMC² Crypto &amp; AI Security" style="display:none">
  </div>
</div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const T={
 nl:{name:"Boodschappen App",tag:"Je boodschappenlijst, de kortste route langs de winkels en samen rijden in comitaat Zala. Bespaar tijd en benzine, en houd ons groene Zala mooi.",dl:"Download voor Android",web:"Open de webversie",
  steps:["Scan de QR-code of tik op <b>Download voor Android</b>.","Open het gedownloade <b>.apk</b>-bestand. Sta \"onbekende apps\" toe als Android daarom vraagt, en tik op <b>Installeren</b>.","iPhone of pc? Tik op <b>Open de webversie</b> en kies \"Zet op beginscherm\".","Log in met je e-mailadres en de code van 6 cijfers uit je mail."]},
 en:{name:"Shopping App",tag:"Your shopping list, the shortest route past the shops and shared rides in Zala county. Save time and fuel, and keep green Zala beautiful.",dl:"Download for Android",web:"Open the web version",
  steps:["Scan the QR code or tap <b>Download for Android</b>.","Open the downloaded <b>.apk</b> file. Allow \"unknown apps\" if Android asks, then tap <b>Install</b>.","iPhone or PC? Tap <b>Open the web version</b> and choose \"Add to Home Screen\".","Sign in with your email address and the 6-digit code from your inbox."]},
 de:{name:"Einkaufs-App",tag:"Deine Einkaufsliste, die kürzeste Route durch die Geschäfte und gemeinsame Fahrten im Komitat Zala. Spar Zeit und Benzin, und halte unser grünes Zala schön.",dl:"Für Android herunterladen",web:"Webversion öffnen",
  steps:["Scanne den QR-Code oder tippe auf <b>Für Android herunterladen</b>.","Öffne die heruntergeladene <b>.apk</b>-Datei. Erlaube „unbekannte Apps“, wenn Android fragt, und tippe auf <b>Installieren</b>.","iPhone oder PC? Tippe auf <b>Webversion öffnen</b> und wähle „Zum Home-Bildschirm“.","Melde dich mit deiner E-Mail-Adresse und dem 6-stelligen Code aus der Mail an."]},
 hu:{name:"Bevásárló App",tag:"Bevásárlólista, a legrövidebb útvonal a boltok között és közös utazás Zala vármegyében. Spórolj időt és benzint, és őrizzük meg a zöld Zalát.",dl:"Letöltés Androidra",web:"Webes verzió megnyitása",
  steps:["Olvasd be a QR-kódot, vagy koppints a <b>Letöltés Androidra</b> gombra.","Nyisd meg a letöltött <b>.apk</b> fájlt. Ha az Android kéri, engedélyezd az „ismeretlen alkalmazásokat”, majd koppints a <b>Telepítés</b> gombra.","iPhone vagy számítógép? Koppints a <b>Webes verzió megnyitása</b> gombra, és add hozzá a kezdőképernyőhöz.","Jelentkezz be az e-mail címeddel és a levélben kapott 6 jegyű kóddal."]}
};
const LANGS=["nl","de","en","hu"],LBL={nl:"NL",de:"DE",en:"EN",hu:"HU"};
function pick(){const q=new URLSearchParams(location.search).get("lang");if(LANGS.includes(q))return q;try{const s=localStorage.getItem("bz-lang");if(LANGS.includes(s))return s;}catch(_){}const n=(navigator.language||"nl").slice(0,2);return LANGS.includes(n)?n:"en";}
const apk=(window.BZ_CONFIG&&window.BZ_CONFIG.apkUrl)||"boodschappen-zala.apk";
let qrMade=false;
function show(l){const t=T[l];document.documentElement.lang=l;document.title="Zala - "+t.name;
 document.getElementById("t_name").textContent=t.name;document.getElementById("t_tag").textContent=t.tag;
 document.getElementById("dl").textContent=t.dl;document.getElementById("dl").href=apk;
 document.getElementById("web").textContent=t.web;
 document.getElementById("t_steps").innerHTML=t.steps.map(s=>"<li>"+s+"</li>").join("");
 document.getElementById("lang").innerHTML=LANGS.map(x=>`<a href="?lang=${x}" data-l="${x}" aria-current="${x===l}">${LBL[x]}</a>`).join("");
 try{localStorage.setItem("bz-lang",l);}catch(_){}
 if(!qrMade){try{new QRCode(document.getElementById("qr"),{text:new URL(apk,location.href).href,width:440,height:440,colorDark:"#1f2a24",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});qrMade=true;}catch(_){}}}
document.addEventListener("click",e=>{const a=e.target.closest("a[data-l]");if(!a)return;e.preventDefault();history.replaceState(null,"","?lang="+a.dataset.l);show(a.dataset.l);});
show(pick());
</script>
</body></html>
